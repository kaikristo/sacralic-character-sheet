name: Publish character sheet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: node scripts/version-assets.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  battle-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install isolated emulator test tools
        run: npm install --prefix .openai/battle-rules --no-audit --no-fund firebase-tools@14.22.0 @firebase/rules-unit-testing@6.0.0 firebase@13.0.0
      - name: Check room permissions and player synchronization
        run: node .openai/battle-rules/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore --project demo-sacralic-battles --config firebase.emulators.json "node tests/battle-rules.test.cjs"

  deploy:
    needs: [validate, battle-permissions]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
